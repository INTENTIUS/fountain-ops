# The platform secrets, layer one — the operator's, not the tenants'.
#
# Copy to platform.enc.yaml, fill in, then encrypt:
#
#   cp secrets/platform.example.yaml secrets/platform.enc.yaml
#   sops --encrypt --in-place secrets/platform.enc.yaml
#
# The encrypted file is committed. This one is an example with no real values
# and is not.
#
# What is NOT here: per-tenant inference credentials. Those are layer two —
# encrypted under MASTER_SECRETS_KEY, stored in fountain's own Postgres, owned
# by the tenants. fountain-ops provisions the key that protects them and never
# touches them.

# Phoenix session signing. `openssl rand -base64 48`
SECRET_KEY_BASE: replace-me

# The key every tenant credential is encrypted under. Generate once with
# `openssl rand 32 | base64 | tr '+/' '-_' | tr -d '=\n'` and never regenerate
# it over an existing database — see the docs on `just master-key`.
MASTER_SECRETS_KEY: replace-me

# These two must agree, and nothing checks that they do.
#
# `just secret` generates them together so they cannot disagree. Here they are
# yours to keep in step: POSTGRES_PASSWORD is what the bundled Postgres comes up
# with, and DATABASE_URL is what the app connects with. A mismatch is a
# password-authentication failure at boot, which reads like a bad credential
# rather than two credentials that were never the same one.
#
# At postgres=cnpg, drop both — the operator provides its own and the app reads
# them from the Secret CNPG creates. At postgres=reference, drop
# POSTGRES_PASSWORD and point DATABASE_URL at the database you already have.
POSTGRES_PASSWORD: replace-me
DATABASE_URL: postgres://fountain:replace-me@fountain-postgres.fountain.svc.cluster.local:5432/fountain

# The data plane credential. A platform secret, never a tenant one.
SPRITES_TOKEN: replace-me

# Only when the backup seam uploads to a real bucket.
AWS_ACCESS_KEY_ID: replace-me
AWS_SECRET_ACCESS_KEY: replace-me
